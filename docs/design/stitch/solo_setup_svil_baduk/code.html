<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Consolas:wght@100..900&family=KyoboHandwriting2019:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        @font-face {
            font-family: 'KyoboHandwriting2019';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/naverfont_08@1.0/KyoboHandwriting2019.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #0D0D12;
            color: #e4e1eb;
            font-family: 'KyoboHandwriting2019', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .brutal-border {
            border: 3px solid #6B6B82;
        }

        .brutal-border-active {
            border: 3px solid #FFFF00;
        }

        .hit-target {
            min-width: 50px;
            min-height: 50px;
        }

        /* Custom Scrollbar for High Contrast */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #0D0D12;
        }
        ::-webkit-scrollbar-thumb {
            background: #6B6B82;
            border: 3px solid #0D0D12;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#7ec8ff",
                        "surface-bright": "#393840",
                        "on-primary-fixed-variant": "#004b70",
                        "on-primary-fixed": "#001e30",
                        "on-primary-container": "#00537c",
                        "on-tertiary-fixed-variant": "#494900",
                        "on-secondary-fixed-variant": "#454749",
                        "primary": "#bee1ff",
                        "surface-container-highest": "#34343c",
                        "on-secondary": "#2f3132",
                        "on-surface": "#e4e1eb",
                        "tertiary-container": "#c7c700",
                        "on-background": "#e4e1eb",
                        "surface-variant": "#34343c",
                        "on-tertiary-container": "#515100",
                        "secondary-fixed": "#e2e2e4",
                        "outline": "#8a929a",
                        "inverse-surface": "#e4e1eb",
                        "on-tertiary-fixed": "#1d1d00",
                        "surface-container-lowest": "#0d0e14",
                        "surface-container": "#1f1f26",
                        "surface-container-low": "#1b1b22",
                        "tertiary": "#e4e400",
                        "inverse-primary": "#006493",
                        "on-primary": "#00344f",
                        "secondary-fixed-dim": "#c6c6c8",
                        "tertiary-fixed": "#eaea00",
                        "secondary-container": "#454749",
                        "outline-variant": "#40484f",
                        "tertiary-fixed-dim": "#cdcd00",
                        "on-secondary-container": "#b4b5b7",
                        "surface-dim": "#13131a",
                        "surface": "#13131a",
                        "error-container": "#93000a",
                        "secondary": "#c6c6c8",
                        "on-secondary-fixed": "#1a1c1d",
                        "surface-tint": "#8dcdff",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#cae6ff",
                        "background": "#13131a",
                        "on-tertiary": "#323200",
                        "surface-container-high": "#292931",
                        "primary-fixed-dim": "#8dcdff",
                        "inverse-on-surface": "#303037",
                        "on-surface-variant": "#c0c7d0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "touch-target-min": "50px",
                        "margin-mobile": "16px",
                        "max-width": "1280px",
                        "unit": "8px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "body-lg": ["KyoboHandwriting2019"],
                        "data-mono": ["Consolas"],
                        "display-lg": ["KyoboHandwriting2019"],
                        "label-sm": ["Consolas"],
                        "body-md": ["KyoboHandwriting2019"],
                        "headline-md": ["KyoboHandwriting2019"]
                    },
                    "fontSize": {
                        "body-lg": ["24px", {"lineHeight": "1.8", "fontWeight": "400"}],
                        "data-mono": ["20px", {"lineHeight": "1.2", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-sm": ["16px", {"lineHeight": "1.2", "fontWeight": "400"}],
                        "body-md": ["18px", {"lineHeight": "1.8", "fontWeight": "400"}],
                        "headline-md": ["32px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen bg-background">
<!-- Top AppBar (from Shared Components JSON) -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-[70px] bg-background border-b-3 border-outline-variant z-50 sticky top-0">
<div class="flex items-center gap-unit">
<button class="hit-target flex items-center justify-center text-on-background focus:outline-none focus:ring-3 focus:ring-tertiary" onclick="history.back()">
<span class="material-symbols-outlined text-[32px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">AI와 겨루기</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:bg-surface-container-highest p-2 rounded">settings</span>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:bg-surface-container-highest p-2 rounded">help</span>
</div>
</header>
<main class="flex-grow w-full max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop py-gutter space-y-gutter">
<!-- Profile Status Line -->
<section class="bg-surface-container border-3 border-outline-variant p-gutter flex flex-wrap items-center justify-between gap-unit">
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center text-on-primary font-bold text-headline-md">P</div>
<div>
<p class="font-headline-md text-on-surface leading-tight">Pro Player</p>
<div class="flex flex-wrap gap-x-4 gap-y-1 font-label-sm text-on-surface-variant text-label-sm uppercase tracking-wider">
<span>Rank: 1 Dan</span>
<span class="text-tertiary">·</span>
<span>W/L: 124 / 82</span>
<span class="text-tertiary">·</span>
<span>High Score: 2840</span>
</div>
</div>
</div>
<div class="hidden md:block">
<div class="bg-surface-container-highest px-4 py-2 border-3 border-outline-variant">
<p class="font-label-sm text-on-surface-variant">CURRENT SESSION</p>
<p class="font-data-mono text-primary">01:24:55</p>
</div>
</div>
</section>
<!-- Setup Form Container -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter">
<!-- Left Column: Opponent & Difficulty -->
<div class="space-y-gutter">
<!-- Opponent Selection -->
<div class="bg-surface-container border-3 border-outline-variant p-gutter">
<label class="block font-label-sm text-on-surface-variant mb-4 uppercase tracking-widest">상대 AI 선택</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<button class="hit-target brutal-border-active bg-surface-container-high p-4 flex flex-col items-start justify-between text-left group">
<span class="material-symbols-outlined text-tertiary mb-2" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-headline-md text-on-surface">KataGo</span>
<span class="font-label-sm text-on-surface-variant">Visits: 1600 (High Performance)</span>
</button>
<button class="hit-target brutal-border bg-surface-container-low p-4 flex flex-col items-start justify-between text-left hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mb-2">memory</span>
<span class="font-headline-md text-on-surface">내장 AI</span>
<span class="font-label-sm text-on-surface-variant">Local Engine (Low Latency)</span>
</button>
</div>
</div>
<!-- Difficulty Grid -->
<div class="bg-surface-container border-3 border-outline-variant p-gutter">
<div class="flex justify-between items-end mb-4">
<label class="font-label-sm text-on-surface-variant uppercase tracking-widest">난이도 설정 (Levels 1–10)</label>
<span class="font-headline-md text-tertiary">Lv. 7 Master</span>
</div>
<div class="grid grid-cols-5 gap-2">
<!-- Difficulty Buttons -->
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">1</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">2</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">3</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">4</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">5</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">6</button>
<button class="hit-target border-3 border-on-surface bg-surface-container-highest font-data-mono text-on-surface ring-4 ring-tertiary/20">7</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">8</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">9</button>
<button class="hit-target brutal-border bg-surface-container-low font-data-mono text-on-surface hover:bg-surface-container-highest">10</button>
</div>
<div class="mt-4 flex justify-between font-label-sm text-on-surface-variant">
<span>Beginner</span>
<span>Grandmaster</span>
</div>
</div>
</div>
<!-- Right Column: Board & Color -->
<div class="space-y-gutter">
<!-- Board Size Select -->
<div class="bg-surface-container border-3 border-outline-variant p-gutter">
<label class="block font-label-sm text-on-surface-variant mb-4 uppercase tracking-widest">바둑판 크기</label>
<div class="flex flex-col gap-2">
<button class="hit-target brutal-border bg-surface-container-low px-gutter py-4 flex justify-between items-center hover:bg-surface-container-highest transition-colors">
<span class="font-data-mono text-headline-md">9 × 9</span>
<span class="font-label-sm text-on-surface-variant">Quick Match</span>
</button>
<button class="hit-target brutal-border bg-surface-container-low px-gutter py-4 flex justify-between items-center hover:bg-surface-container-highest transition-colors">
<span class="font-data-mono text-headline-md">13 × 13</span>
<span class="font-label-sm text-on-surface-variant">Intermediate</span>
</button>
<button class="hit-target border-3 border-on-surface bg-surface-container-highest px-gutter py-4 flex justify-between items-center">
<span class="font-data-mono text-headline-md text-primary">19 × 19</span>
<span class="font-label-sm text-tertiary">Standard (Active)</span>
</button>
</div>
</div>
<!-- Color Radios -->
<div class="bg-surface-container border-3 border-outline-variant p-gutter">
<label class="block font-label-sm text-on-surface-variant mb-4 uppercase tracking-widest">돌 색상 선택</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="hidden peer" name="color" type="radio"/>
<div class="hit-target brutal-border bg-surface-container-low peer-checked:bg-on-surface peer-checked:text-background flex items-center justify-center gap-4 transition-all p-4">
<div class="w-8 h-8 rounded-full bg-[#0D0D12] border-2 border-[#3A3A48]"></div>
<span class="font-headline-md">흑 (Black)</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="hidden peer" name="color" type="radio"/>
<div class="hit-target brutal-border bg-surface-container-low peer-checked:bg-on-surface peer-checked:text-background flex items-center justify-center gap-4 transition-all p-4">
<div class="w-8 h-8 rounded-full bg-[#F5F5F7] border-2 border-[#C9C9D4]"></div>
<span class="font-headline-md">백 (White)</span>
</div>
</label>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col md:flex-row gap-4 pt-8">
<button class="hit-target flex-grow bg-on-background text-background font-headline-md font-bold py-6 hover:bg-primary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">play_arrow</span>
                대국 시작
            </button>
<button class="hit-target md:w-1/3 brutal-border bg-background text-on-background font-headline-md py-6 hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">upload_file</span>
                기보 불러오기
            </button>
</div>
</main>
<!-- Bottom NavBar (from Shared Components JSON) -->
<!-- Hidden on setup focus screens as per UX mandates, but included for accessibility if required -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-[80px] bg-surface-container-lowest border-t-3 border-outline-variant z-50">
<a class="flex flex-col items-center justify-center text-on-surface h-full w-full active:scale-95" href="#">
<span class="material-symbols-outlined">grid_4x4</span>
<span class="font-label-sm text-label-sm">Board</span>
</a>
<a class="flex flex-col items-center justify-center bg-tertiary text-on-tertiary-fixed rounded-none h-full w-full active:scale-95" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="font-label-sm text-label-sm">Solo</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface h-full w-full active:scale-95" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span class="font-label-sm text-label-sm">Stats</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface h-full w-full active:scale-95" href="#">
<span class="material-symbols-outlined">menu</span>
<span class="font-label-sm text-label-sm">Menu</span>
</a>
</nav>
<script>
        // Simple Interaction logic for difficulty levels
        document.querySelectorAll('button.brutal-border').forEach(btn => {
            if (btn.innerText.match(/^\d+$/)) {
                btn.addEventListener('click', function() {
                    // Remove active state from all
                    document.querySelectorAll('button.border-3.border-on-surface').forEach(active => {
                        active.classList.remove('border-3', 'border-on-surface', 'bg-surface-container-highest', 'ring-4', 'ring-tertiary/20');
                        active.classList.add('brutal-border', 'bg-surface-container-low');
                    });
                    
                    // Add active state to clicked
                    this.classList.remove('brutal-border', 'bg-surface-container-low');
                    this.classList.add('border-3', 'border-on-surface', 'bg-surface-container-highest', 'ring-4', 'ring-tertiary/20');
                    
                    // Update label (Mock labels)
                    const labels = ["Novice", "Beginner", "Casual", "Amateur", "Intermediate", "Advanced", "Expert", "Master", "Grandmaster", "Legend"];
                    const level = parseInt(this.innerText);
                    document.querySelector('.text-tertiary.font-headline-md').innerText = `Lv. ${level} ${labels[level-1]}`;
                });
            }
        });

        // Board size toggle
        document.querySelectorAll('.flex-col > button').forEach(btn => {
            btn.addEventListener('click', function() {
                const parent = this.parentElement;
                parent.querySelectorAll('button').forEach(b => {
                    b.classList.remove('border-3', 'border-on-surface', 'bg-surface-container-highest');
                    b.classList.add('brutal-border', 'bg-surface-container-low');
                    b.querySelector('.text-primary')?.classList.remove('text-primary');
                    b.querySelector('.text-tertiary')?.classList.add('hidden');
                });

                this.classList.remove('brutal-border', 'bg-surface-container-low');
                this.classList.add('border-3', 'border-on-surface', 'bg-surface-container-highest');
                this.querySelector('.font-data-mono').classList.add('text-primary');
                // Could toggle the "Active" label here if we had it structure correctly
            });
        });
    </script>
</body></html>
