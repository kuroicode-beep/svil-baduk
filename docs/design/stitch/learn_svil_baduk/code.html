<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SVIL Baduk - 배우기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Consolas:wght@100..900&family=KyoboHandwriting2019:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        @font-face {
            font-family: 'KyoboHandwriting2019';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/KyoboHandwriting2019.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        
        body {
            background-color: #0d0d12;
            color: #e4e1eb;
            font-family: 'KyoboHandwriting2019', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            vertical-align: middle;
        }

        /* High Contrast Focus States */
        .focus-ring:focus {
            outline: 3px solid #FFFF00 !important;
            outline-offset: 2px;
        }

        /* Baduk Board Grid Styling */
        .board-grid {
            background-color: #16161D;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            aspect-ratio: 1 / 1;
            border: 3px solid #6B6B82;
            position: relative;
        }
        .grid-line-h {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #6B6B82;
        }
        .grid-line-v {
            position: absolute;
            height: 100%;
            width: 2px;
            background-color: #6B6B82;
        }

        /* Stones */
        .stone-white {
            background-color: #F5F5F7;
            border-radius: 50%;
            width: 85%;
            height: 85%;
            box-shadow: 0 4px 0 #6B6B82;
        }
        .stone-black {
            background-color: #0D0D12;
            border: 2px solid #3A3A48;
            border-radius: 50%;
            width: 85%;
            height: 85%;
            box-shadow: 0 4px 0 #1F1F2A;
        }

        /* Custom Scrollbar for High Contrast */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d12;
        }
        ::-webkit-scrollbar-thumb {
            background: #6B6B82;
            border: 3px solid #0d0d12;
        }
    </style>

</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->

<div class="flex items-center gap-4">
<button class="w-[50px] h-[50px] flex items-center justify-center hover:bg-surface-container-highest focus:ring-3 focus:ring-tertiary rounded-lg">

<div class="flex gap-4">

<span class="material-symbols-outlined">settings</span>
</button>

</header>
<!-- Main Content Area with SideNav Context -->
<div class="flex flex-1 overflow-hidden">
<!-- SideNav (Desktop Only) -->
<nav class="hidden md:flex flex-col gap-unit p-gutter bg-surface-container border-r-3 border-outline-variant w-[280px] h-full shrink-0">
<div class="mb-gutter">
<h2 class="font-headline-md text-headline-md text-on-surface">Pro Player</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Rank: 1 Dan</p>
</div>
<a class="flex items-center gap-4 p-4 border-3 border-transparent hover:border-outline hover:bg-surface-container-high transition-all" href="#">

</a>
<a class="flex items-center gap-4 p-4 border-3 border-transparent hover:border-outline hover:bg-surface-container-high transition-all" href="#">

</a>
<a class="flex items-center gap-4 p-4 border-3 border-transparent hover:border-outline hover:bg-surface-container-high transition-all" href="#">
<span class="material-symbols-outlined">history</span>

<a class="flex items-center gap-4 p-4 bg-tertiary text-on-tertiary-fixed font-bold border-3 border-tertiary" href="#">

<a class="flex items-center gap-4 p-4 border-3 border-transparent hover:border-outline hover:bg-surface-container-high transition-all" href="#">

</a>
<div class="mt-auto">
<button class="w-full bg-on-background text-background font-bold h-[60px] flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined">add</span>

<a class="flex items-center gap-4 p-4 text-on-surface-variant border-3 border-transparent hover:border-outline transition-all" href="#">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-lg text-body-lg">Logout</span>
</a>
</div>
</nav>
<!-- Dynamic Content Canvas -->
<main class="flex-1 overflow-y-auto p-gutter bg-background relative flex flex-col items-center">
<!-- Mode Tabs -->
<div class="flex w-full max-w-4xl border-b-3 border-outline-variant mb-gutter">
<button class="flex-1 py-4 font-headline-md text-headline-md border-b-3 border-tertiary text-primary transition-all" id="tab-lesson" onclick="switchTab('lesson')">
                    단계별 배우기
                </button>
<button class="flex-1 py-4 font-headline-md text-headline-md border-b-3 border-transparent text-on-surface-variant hover:bg-surface-container-highest transition-all" id="tab-practice" onclick="switchTab('practice')">
                    따냄 연습
                </button>
</div>
<!-- Lesson Mode Container -->
<section class="w-full max-w-5xl flex flex-col md:flex-row gap-gutter" id="mode-lesson">
<div class="flex-1 bg-surface-container-low border-3 border-outline-variant p-gutter flex flex-col gap-6">
<h3 class="font-headline-md text-headline-md text-primary">제 1장: 바둑의 기초</h3>
<p class="font-body-lg text-body-lg text-on-surface">
                        바둑은 두 사람이 흑과 백의 돌을 번갈아 가며 놓아 집을 더 많이 차지하는 게임입니다. 돌은 선이 만나는 교차점에만 놓을 수 있습니다.
                    </p>
<div class="mt-auto flex justify-between gap-4">
<button class="flex-1 h-[60px] bg-background text-on-background border-3 border-outline-variant font-bold flex items-center justify-center gap-2 hover:bg-surface-container-highest focus:ring-3 focus:ring-tertiary">
<span class="material-symbols-outlined">chevron_left</span> 이전
                        </button>
<button class="flex-1 h-[60px] bg-on-background text-background font-bold flex items-center justify-center gap-2 hover:opacity-90 focus:ring-3 focus:ring-tertiary">
                            다음 <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
<!-- Board Hint Area -->
<div class="flex-1 aspect-square bg-surface-container border-3 border-outline-variant p-4 flex flex-col items-center justify-center gap-4">
<span class="text-on-surface-variant font-label-sm">시각적 도움: 교차점 강조</span>
<div class="board-grid w-full h-full relative">
<!-- Horizontal Lines -->
<div class="grid-line-h top-[11.1%]"></div><div class="grid-line-h top-[22.2%]"></div>
<div class="grid-line-h top-[33.3%]"></div><div class="grid-line-h top-[44.4%]"></div>

<div class="grid-line-v left-[33.3%]"></div><div class="grid-line-v left-[44.4%]"></div>
<div class="grid-line-v left-[55.5%]"></div><div class="grid-line-v left-[66.6%]"></div>
<div class="grid-line-v left-[77.7%]"></div><div class="grid-line-v left-[88.8%]"></div>
<!-- Sample Stones -->
<div class="absolute inset-0 grid grid-cols-9 grid-rows-9 p-[1%]">
<div class="col-start-5 row-start-5 flex items-center justify-center">
<div class="stone-black"></div>
</div>
<!-- Focus Indicator -->
<div class="col-start-5 row-start-4 flex items-center justify-center">
<div class="w-[80%] h-[80%] border-4 border-dashed border-tertiary rounded-full animate-pulse"></div>
</div>
</div>
</div>
<div class="text-on-surface-variant font-data-mono text-center">좌표: E5 (중심)</div>
</div>
</section>
<!-- Practice Mode Container (Hidden by default) -->
<section class="hidden w-full max-w-6xl flex flex-col md:flex-row gap-gutter" id="mode-practice">
<!-- Board on Left -->
<div class="flex-[1.5] aspect-square bg-surface-container border-3 border-outline-variant p-4">
<div class="board-grid w-full h-full relative">
<!-- Grid lines repeated for practice -->
<div class="grid-line-h top-[11.1%]"></div><div class="grid-line-h top-[22.2%]"></div><div class="grid-line-h top-[33.3%]"></div><div class="grid-line-h top-[44.4%]"></div><div class="grid-line-h top-[55.5%]"></div><div class="grid-line-h top-[66.6%]"></div><div class="grid-line-h top-[77.7%]"></div><div class="grid-line-h top-[88.8%]"></div>
<div class="grid-line-v left-[11.1%]"></div><div class="grid-line-v left-[22.2%]"></div><div class="grid-line-v left-[33.3%]"></div><div class="grid-line-v left-[44.4%]"></div><div class="grid-line-v left-[55.5%]"></div><div class="grid-line-v left-[66.6%]"></div><div class="grid-line-v left-[77.7%]"></div><div class="grid-line-v left-[88.8%]"></div>
<div class="absolute inset-0 grid grid-cols-9 grid-rows-9 p-[1%]">
<!-- Puzzle setup stones -->
<div class="col-start-4 row-start-4 flex items-center justify-center"><div class="stone-white"></div></div>
<div class="col-start-5 row-start-3 flex items-center justify-center"><div class="stone-black"></div></div>

<!-- Interaction focus -->
<button class="col-start-5 row-start-4 focus-ring flex items-center justify-center bg-tertiary/10 rounded-full transition-colors group">

</div>
</div>

<!-- Panel on Right -->

<button class="h-[64px] w-full bg-secondary-container text-on-secondary-container font-bold flex items-center justify-center gap-4 hover:bg-surface-container-highest focus:ring-3 focus:ring-tertiary transition-all">

<span class="font-body-lg text-body-lg">힌트 보기</span>
</button>

</button>

<span class="material-symbols-outlined">grid_4x4</span>
<span class="font-label-sm text-label-sm">Board</span>

<span class="font-label-sm text-label-sm">Learn</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface h-full w-full hover:bg-surface-container-highest">
<span class="material-symbols-outlined">menu</span>
<span class="font-label-sm text-label-sm">Menu</span>
</button>
</footer>
<script>
        function switchTab(mode) {
            const lessonTab = document.getElementById('tab-lesson');
            const practiceTab = document.getElementById('tab-practice');
            const lessonSection = document.getElementById('mode-lesson');
            const practiceSection = document.getElementById('mode-practice');

            if (mode === 'lesson') {
                lessonTab.classList.add('border-tertiary', 'text-primary');
                lessonTab.classList.remove('border-transparent', 'text-on-surface-variant');
                practiceTab.classList.remove('border-tertiary', 'text-primary');
                practiceTab.classList.add('border-transparent', 'text-on-surface-variant');
                
                lessonSection.classList.remove('hidden');
                practiceSection.classList.add('hidden');
            } else {
                practiceTab.classList.add('border-tertiary', 'text-primary');
                practiceTab.classList.remove('border-transparent', 'text-on-surface-variant');
                lessonTab.classList.remove('border-tertiary', 'text-primary');
                lessonTab.classList.add('border-transparent', 'text-on-surface-variant');

                practiceSection.classList.remove('hidden');
                lessonSection.classList.add('hidden');
            }
        }
    </script>
