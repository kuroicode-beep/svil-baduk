<!-- Interactive micro-interactions script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Haptic-like visual feedback
                btn.classList.add('scale-95');
                setTimeout(() => btn.classList.remove('scale-95'), 100);
            });
        });

        // Board interaction mock
        const board = document.getElementById('baduk-board');
        board.addEventListener('click', (e) => {
            const rect = board.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Logic to snap to nearest intersection would go here
            console.log(`Board click at: ${x}, ${y}`);
        });

        // Toggle focus on keyboard navigation
        window.addEventListener('keydown', (e) => {
            if(e.key === 'Tab') {
                document.body.classList.add('keyboard-nav');
            }
        });
    </script>
