<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SVIL Baduk - 캐릭터 프로필</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config and Custom Typography -->

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#7ec8ff",

                    "on-secondary": "#2f3132",
                    "on-surface": "#e4e1eb",

                    "on-background": "#e4e1eb",
                    "surface-variant": "#34343c",
                    "on-tertiary-container": "#515100",
                    "secondary-fixed": "#e2e2e4",
                    "outline": "#8a929a",
                    "inverse-surface": "#e4e1eb",
                    "on-tertiary-fixed": "#1d1d00",
                    "surface-container-lowest": "#0d0e14",
                    "surface-container": "#1f1f26",
                    "surface-container-low": "#1b1b22",
                    "tertiary": "#e4e400",
                    "inverse-primary": "#006493",
                    "on-primary": "#00344f",
                    "secondary-fixed-dim": "#c6c6c8",
                    "tertiary-fixed": "#eaea00",
                    "secondary-container": "#454749",
                    "outline-variant": "#40484f",
                    "tertiary-fixed-dim": "#cdcd00",
                    "on-secondary-container": "#b4b5b7",
                    "surface-dim": "#13131a",
                    "surface": "#13131a",
                    "error-container": "#93000a",
                    "secondary": "#c6c6c8",
                    "on-secondary-fixed": "#1a1c1d",
                    "surface-tint": "#8dcdff",
                    "error": "#ffb4ab",
                    "on-error": "#690005",
                    "on-error-container": "#ffdad6",
                    "primary-fixed": "#cae6ff",
                    "background": "#13131a",
                    "on-tertiary": "#323200",
                    "surface-container-high": "#292931",
                    "primary-fixed-dim": "#8dcdff",

            },
            "borderRadius": {

            "spacing": {

            "fontFamily": {

<style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap');
        
        body {
            background-color: #13131a; /* bg-background */
            color: #e4e1eb; /* text-on-background */
            font-family: 'Nanum Gothic', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }

        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }

        /* Brutalist Hard Edges */
        .brutal-border {
            border: 3px solid #6B6B82;
        }
        
        .active-focus {
            border-color: #FFFF00 !important;
            outline: none;
        }

        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #34343c;
            border: 3px solid #0d0e14;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="bg-background dark:bg-background text-on-background dark:text-on-background flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-[70px] border-b-3 border-outline-variant z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-highest transition-all duration-100 flex items-center justify-center focus:outline-none focus:ring-3 focus:ring-tertiary">
<span class="material-symbols-outlined text-headline-md">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">캐릭터</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors" data-icon="settings">settings</span>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors" data-icon="help">help</span>
</div>
</header>
<main class="flex-grow w-full max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop py-gutter mb-[100px]">
<!-- Profile & XP Section (High Contrast Digital Brutalism) -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
<!-- Profile Card -->
<div class="lg:col-span-5 flex flex-col gap-unit">
<div class="bg-surface-container-low p-gutter border-3 border-outline-variant rounded-none flex flex-col items-center gap-6">
<div class="relative w-[160px] h-[160px] bg-tertiary flex items-center justify-center border-4 border-on-tertiary-fixed">
<span class="material-symbols-outlined text-[80px] text-on-tertiary-fixed fill-icon" data-icon="face">face</span>
<div class="absolute -bottom-2 -right-2 bg-primary px-4 py-1 border-3 border-on-primary-fixed shadow-none">
<span class="font-label-sm text-label-sm font-bold text-on-primary-fixed">Level 3</span>
</div>
</div>
<div class="text-center">
<h2 class="font-headline-md text-headline-md font-extrabold text-primary mb-2">돌이</h2>
<div class="flex flex-col gap-2 w-full min-w-[280px]">
<div class="flex justify-between items-end mb-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">XP PROGRESS</span>
<span class="font-label-sm text-label-sm text-tertiary">75%</span>
</div>
<div class="w-full h-8 bg-surface-container-highest border-3 border-outline-variant p-1">
<div class="bg-tertiary h-full transition-all duration-1000" style="width: 75%;"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-2">Next Level: 4 Dan</p>
</div>
</div>
</div>
<!-- Stats Grid (Bento Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-unit">
<div class="bg-surface-container p-6 border-3 border-outline-variant flex flex-col justify-between min-h-[120px]">
<span class="font-label-sm text-label-sm text-on-surface-variant">전적 (W/L/D)</span>
<span class="font-data-mono text-headline-md font-bold text-primary">42 / 18 / 2</span>
</div>
<div class="bg-surface-container p-6 border-3 border-outline-variant flex flex-col justify-between min-h-[120px]">
<span class="font-label-sm text-label-sm text-on-surface-variant">최고 점수</span>
<span class="font-data-mono text-headline-md font-bold text-tertiary">2,840</span>
</div>
<div class="bg-surface-container p-6 border-3 border-outline-variant flex flex-col justify-between md:col-span-2 min-h-[120px]">
<span class="font-label-sm text-label-sm text-on-surface-variant">최고 격파 AI 난이도</span>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="smart_toy">smart_toy</span>
<span class="font-headline-md text-headline-md font-extrabold">Professional (9 Dan)</span>
</div>
</div>
</div>
</div>
<!-- Edit & Character Customization Section -->
<div class="lg:col-span-7 flex flex-col gap-gutter">
<div class="bg-surface-container-high p-gutter border-3 border-outline-variant h-full">
<h3 class="font-headline-md text-headline-md font-bold mb-8 border-b-3 border-tertiary pb-2 inline-block">프로필 수정</h3>
<form class="flex flex-col gap-8">
<!-- Name Input -->
<div class="flex flex-col gap-3">
<label class="font-body-lg text-body-lg font-bold" for="char_name">캐릭터 이름</label>
<input class="bg-surface-container-highest border-3 border-outline-variant p-4 font-body-lg text-body-lg text-on-surface focus:ring-3 focus:ring-tertiary focus:border-tertiary outline-none transition-all" id="char_name" type="text" value="돌이"/>
</div>
<!-- Symbol Picker (Large Touch Targets) -->
<div class="flex flex-col gap-3">
<label class="font-body-lg text-body-lg font-bold">심볼 선택</label>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
<!-- Option 1 -->
<label class="cursor-pointer group">
<input checked="" class="hidden peer" name="avatar" type="radio"/>
<div class="w-full aspect-square border-3 border-outline-variant bg-surface-container-highest peer-checked:border-tertiary peer-checked:bg-tertiary-container flex flex-col items-center justify-center gap-2 transition-all p-4">
<span class="material-symbols-outlined text-[40px] peer-checked:text-on-tertiary-container" data-icon="face">face</span>
<span class="font-label-sm text-label-sm">기본</span>
</div>
</label>
<!-- Option 2 -->
<label class="cursor-pointer group">
<input class="hidden peer" name="avatar" type="radio"/>
<div class="w-full aspect-square border-3 border-outline-variant bg-surface-container-highest peer-checked:border-tertiary peer-checked:bg-tertiary-container flex flex-col items-center justify-center gap-2 transition-all p-4">
<span class="material-symbols-outlined text-[40px]" data-icon="bolt">bolt</span>
<span class="font-label-sm text-label-sm">번개</span>
</div>
</label>
<!-- Option 3 -->
<label class="cursor-pointer group">
<input class="hidden peer" name="avatar" type="radio"/>
<div class="w-full aspect-square border-3 border-outline-variant bg-surface-container-highest peer-checked:border-tertiary peer-checked:bg-tertiary-container flex flex-col items-center justify-center gap-2 transition-all p-4">
<span class="material-symbols-outlined text-[40px]" data-icon="shield">shield</span>
<span class="font-label-sm text-label-sm">방패</span>
</div>
</label>
<!-- Option 4 -->
<label class="cursor-pointer group">
<input class="hidden peer" name="avatar" type="radio"/>
<div class="w-full aspect-square border-3 border-outline-variant bg-surface-container-highest peer-checked:border-tertiary peer-checked:bg-tertiary-container flex flex-col items-center justify-center gap-2 transition-all p-4">
<span class="material-symbols-outlined text-[40px]" data-icon="military_tech">military_tech</span>
<span class="font-label-sm text-label-sm">메달</span>
</div>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 pt-4 mt-auto">
<button class="flex-1 bg-on-background text-background h-[60px] font-headline-md text-headline-md font-bold hover:bg-primary transition-all flex items-center justify-center gap-3" type="submit">
<span class="material-symbols-outlined" data-icon="save">save</span>
                                저장하기
                            </button>
<button class="flex-1 border-3 border-outline-variant bg-background text-on-background h-[60px] font-headline-md text-headline-md font-bold hover:bg-surface-container-highest transition-all flex items-center justify-center gap-3" type="button">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
                                취소
                            </button>
</div>
</form>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component Strategy) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-[80px] bg-surface-container-lowest dark:bg-surface-container-lowest border-t-3 border-outline-variant z-50">
<button class="flex flex-col items-center justify-center text-on-surface h-full w-full hover:bg-surface-container-highest transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="grid_4x4">grid_4x4</span>
<span class="font-label-sm text-label-sm">Board</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface h-full w-full hover:bg-surface-container-highest transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
<span class="font-label-sm text-label-sm">Stats</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface h-full w-full hover:bg-surface-container-highest transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="build">build</span>
<span class="font-label-sm text-label-sm">Tools</span>
</button>
<!-- ACTIVE: Menu/Profile -->
<button class="flex flex-col items-center justify-center bg-tertiary text-on-tertiary-fixed rounded-none h-full w-full transition-all active:scale-95">
<span class="material-symbols-outlined fill-icon" data-icon="menu">menu</span>
<span class="font-label-sm text-label-sm">Menu</span>
</button>
</nav>
<script>
        // Simple Interaction logic for feedback
        document.querySelectorAll('button, label').forEach(el => {
            el.addEventListener('click', () => {
                // Haptic-like visual feedback handled via active:scale-95 in tailwind
            });
        });

        // Form submission prevention for demo
        document.querySelector('form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> 저장 중...';
            btn.classList.add('bg-tertiary');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> 완료!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-tertiary');
                }, 2000);
            }, 1000);
        });
    </script>
</body></html>
